_BASE_: "COCO-Detection/faster_rcnn_R_50_FPN_3x.yaml"

DATASETS:
  TRAIN: ["realcolon_patient_train"]
  TEST:  ["realcolon_patient_val"]

INPUT:
  MIN_SIZE_TRAIN: (640,)
  MAX_SIZE_TRAIN: 640
  MIN_SIZE_TEST: 640
  MAX_SIZE_TEST: 640
  CROP:
    ENABLED: False

MODEL:
  ROI_HEADS:
    NUM_CLASSES: 1
    SCORE_THRESH_TEST: 0.001 # Match Ultralytics
  DEVICE: "cuda"
  WEIGHTS: "https://dl.fbaipublicfiles.com/detectron2/COCO-Detection/faster_rcnn_R_50_FPN_3x/137849458/model_final_280758.pkl"

DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: False
  NUM_WORKERS: 16

SOLVER:
  IMS_PER_BATCH: 96
  BASE_LR: 0.02
  MAX_ITER: 267000 #(1706635/96)*15
  STEPS: (160000, 213500) # 60% and 80%
  AMP:
    ENABLED: True

TEST:
  EVAL_PERIOD: 17777 # every epoch

SEED: 42

OUTPUT_DIR: "path/to/output"
