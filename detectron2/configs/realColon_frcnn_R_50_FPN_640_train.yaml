_BASE_: "COCO-Detection/faster_rcnn_R_50_FPN_3x.yaml"

DATASETS:
  TRAIN: ["realcolon_patient_train"]
  TEST:  ["realcolon_patient_val"]

INPUT:
  MIN_SIZE_TRAIN: (640,)
  MAX_SIZE_TRAIN: 640
  MIN_SIZE_TEST: 640
  MAX_SIZE_TEST: 640
  CROP:
    ENABLED: False

MODEL:
  ROI_HEADS:
    NUM_CLASSES: 1
    SCORE_THRESH_TEST: 0.001
  DEVICE: "cuda"
  WEIGHTS: "https://dl.fbaipublicfiles.com/detectron2/COCO-Detection/faster_rcnn_R_50_FPN_3x/137849458/model_final_280758.pkl"

DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: False
  NUM_WORKERS: 16

SOLVER:
  IMS_PER_BATCH: 96
  BASE_LR: 0.02
  MAX_ITER: 71800
  STEPS: (42648, 57440) # 60% and 80%
  AMP:
    ENABLED: True

TEST:
  EVAL_PERIOD: 35540 # every 3 epochs

SEED: 0

OUTPUT_DIR: "outputs/frcnn_r50_fpn_realcolon_s0_lr"


# python custom_train.py --config-file ./configs/realColon_frcnn_R_50_FPN_640_train.yaml --num-gpus 2