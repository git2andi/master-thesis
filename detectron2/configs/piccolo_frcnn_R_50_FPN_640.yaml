_BASE_: "COCO-Detection/faster_rcnn_R_50_FPN_3x.yaml"

DATASETS:
  TRAIN: ["piccolo_split_train"]
  #TEST:  ["piccolo_split_val"]
  TEST:  ["realcolon_patient_test"]

INPUT:
  MIN_SIZE_TRAIN: (640,)
  MAX_SIZE_TRAIN: 640
  MIN_SIZE_TEST: 640
  MAX_SIZE_TEST: 640
  CROP:
    ENABLED: False

MODEL:
  ROI_HEADS:
    NUM_CLASSES: 1
    SCORE_THRESH_TEST: 0.001
  DEVICE: "cuda"
  #WEIGHTS: "https://dl.fbaipublicfiles.com/detectron2/COCO-Detection/faster_rcnn_R_50_FPN_3x/137849458/model_final_280758.pkl"
  WEIGHTS: "/home/stud/aschwab/master-thesis/detectron2/outputs/frcnn_r50_fpn_piccolo_s42_lr/model_final.pth"


DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: False
  NUM_WORKERS: 16

SOLVER:
  IMS_PER_BATCH: 96 # 1 for test
  BASE_LR: 0.02
  MAX_ITER: 10000
  STEPS: (6000, 8000) # 60% and 80%
  AMP:
    ENABLED: True

TEST:
  EVAL_PERIOD: 500

SEED: 42

OUTPUT_DIR: "outputs/fasterrcnn_piccolo_realcolon"

