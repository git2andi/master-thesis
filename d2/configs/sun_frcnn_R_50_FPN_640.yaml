_BASE_: "COCO-Detection/faster_rcnn_R_50_FPN_3x.yaml"

DATASETS:
  TRAIN: ["sun_split_train"]
  #TEST:  ["sun_split_val"]
  TEST:  ["sun_split_test"]

INPUT:
  MIN_SIZE_TRAIN: (640,)
  MAX_SIZE_TRAIN: 640
  MIN_SIZE_TEST: 640
  MAX_SIZE_TEST: 640
  CROP:
    ENABLED: False

MODEL:
  ROI_HEADS:
    NUM_CLASSES: 1
    SCORE_THRESH_TEST: 0.001
  DEVICE: "cuda"
  #WEIGHTS: "https://dl.fbaipublicfiles.com/detectron2/COCO-Detection/faster_rcnn_R_50_FPN_3x/137849458/model_final_280758.pkl"
  WEIGHTS: "/home/stud/aschwab/master-thesis/detectron2/outputs/frcnn_r50_fpn_sun_s42_640_lr/model_final.pth"

DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: False
  NUM_WORKERS: 12

SOLVER:
  IMS_PER_BATCH: 18 # 96 or 1
  BASE_LR: 0.02
  # 15 epochs for 93754 training images
  # iters/epoch = ceil(93754 / 96) = 977
  # MAX_ITER     = 15 * 977 = 14655
  MAX_ITER: 20000
  STEPS: (12000, 16000) # 60% and 80%
  AMP:
    ENABLED: True

TEST:
  EVAL_PERIOD: 5000

SEED: 42

OUTPUT_DIR: "outputs/frcnn_r50_fpn_sun_s42_640_lr/eval"


